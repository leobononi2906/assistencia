<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ERP Bononi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --background:218 30% 96%; --foreground:217 56% 13%; --card:0 0% 100%;
  --surface2:215 38% 97%; --primary:222 70% 33%; --blue-mid:204 100% 40%;
  --blue-light:196 100% 47%; --blue-pale:205 89% 95%; --muted-foreground:217 18% 44%;
  --text-muted:220 15% 67%; --border:215 32% 92%; --success:158 87% 34%;
  --success-bg:158 60% 94%; --warning:32 100% 44%; --warning-bg:38 92% 95%;
  --destructive:4 70% 50%; --destructive-bg:4 81% 96%; --sidebar-background:222 70% 33%;
  --radius:12px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;color:hsl(var(--foreground));
  background:hsl(var(--background));-webkit-font-smoothing:antialiased}
.mono{font-family:'DM Mono',monospace}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,hsl(222 70% 33%),hsl(204 100% 40%));z-index:50}
.login-card{background:hsl(var(--card));border-radius:var(--radius);padding:32px;width:340px;
  box-shadow:0 12px 40px rgba(0,0,0,.25)}
.login-card h1{font-size:20px;font-weight:700;color:hsl(var(--primary));text-align:center;margin-bottom:4px}
.login-card p{font-size:12px;color:hsl(var(--muted-foreground));text-align:center;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:hsl(var(--text-muted));margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid hsl(var(--border));
  border-radius:var(--radius-sm);background:hsl(var(--card));color:hsl(var(--foreground));outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:hsl(var(--blue-mid))}
.btn{padding:9px 16px;border:none;border-radius:var(--radius-sm);font-weight:600;font-size:13px;
  background:hsl(var(--primary));color:#fff;transition:.15s}
.btn:hover{background:hsl(222 70% 28%)}
.btn-block{width:100%}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{background:transparent;color:hsl(var(--primary));border:1px solid hsl(var(--border))}
.btn-ghost:hover{background:hsl(var(--surface2))}
.tabs{display:flex;gap:4px;border-bottom:1px solid hsl(var(--border));margin:14px 0 12px}
.tabs .tab{padding:8px 16px;font-size:13px;font-weight:600;color:hsl(var(--text-muted));cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs .tab:hover{color:hsl(var(--foreground))}
.tabs .tab.active{color:hsl(var(--primary));border-bottom-color:hsl(var(--primary))}
.btn-danger{background:hsl(var(--destructive))}
.btn-danger:hover{background:hsl(4 70% 42%)}
.btn-ok{background:hsl(var(--success))}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:hsl(var(--sidebar-background));
  color:#fff;overflow-y:auto;padding:16px 0;z-index:20}
.sidebar .brand{font-size:17px;font-weight:700;padding:0 20px 16px;letter-spacing:.02em}
.sidebar .grp{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:rgba(255,255,255,.35);padding:14px 20px 6px}
.sidebar a{display:block;padding:8px 20px;font-size:13px;color:rgba(255,255,255,.65);
  text-decoration:none;border-left:3px solid transparent;transition:.12s}
.sidebar a:hover{color:rgba(255,255,255,.95);background:rgba(255,255,255,.05)}
.sidebar a.active{color:hsl(var(--blue-light));background:hsla(196 100% 47%/.18);
  border-left-color:hsl(var(--blue-light));font-weight:600}
.main{margin-left:230px;min-height:100vh}
.topbar{position:sticky;top:0;background:hsl(var(--card));border-bottom:1px solid hsl(var(--border));
  padding:12px 24px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.topbar .title{font-size:16px;font-weight:600}
.topbar .user{font-size:12px;color:hsl(var(--muted-foreground));display:flex;gap:12px;align-items:center}
.content{padding:20px 24px}

/* ---------- CARDS / TABELA ---------- */
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);
  box-shadow:0 1px 3px rgba(15,29,53,.04)}
.card-pad{padding:18px}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.metric{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);
  padding:16px;box-shadow:0 1px 3px rgba(15,29,53,.04)}
.metric .lbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  color:hsl(var(--text-muted));margin-bottom:8px}
.metric .val{font-family:'DM Mono',monospace;font-weight:700;font-size:22px;color:hsl(var(--foreground))}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search],.toolbar input[type=text],.toolbar select{padding:8px 11px;
  border:1px solid hsl(var(--border));border-radius:var(--radius-sm);background:hsl(var(--card));outline:none}
.toolbar .spacer{flex:1}
.tbl-wrap{overflow-x:auto;border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--card))}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{padding:8px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  color:hsl(var(--text-muted));background:hsl(var(--surface2));border-bottom:1px solid hsl(var(--border));text-align:left;white-space:nowrap}
table.data td{padding:8px 14px;border-bottom:1px solid hsl(var(--border));white-space:nowrap}
table.data tr:hover td{background:hsl(var(--surface2))}
table.data td.acoes{text-align:right}
.b-badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:4px;display:inline-block}
.b-badge-ok{background:hsl(var(--success-bg));color:hsl(var(--success))}
.b-badge-warn{background:hsl(var(--warning-bg));color:hsl(var(--warning))}
.b-badge-err{background:hsl(var(--destructive-bg));color:hsl(var(--destructive))}
.b-badge-info{background:hsl(var(--blue-pale));color:hsl(var(--blue-mid))}
.b-badge-muted{background:hsl(var(--surface2));color:hsl(var(--muted-foreground))}
.empty{text-align:center;padding:44px 12px;color:hsl(var(--muted-foreground));font-size:13px}
.err{background:hsla(4 70% 50%/.1);border:1px solid hsla(4 70% 50%/.3);border-radius:var(--radius-sm);
  padding:12px 14px;color:hsl(var(--destructive));font-size:13px;font-weight:500}
.skel{background:linear-gradient(90deg,hsl(var(--surface2)),hsl(var(--border)),hsl(var(--surface2)));
  background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px;height:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Config two-pane */
.cfg{display:grid;grid-template-columns:230px 1fr;gap:18px}
.cfg-nav{max-height:calc(100vh - 140px);overflow-y:auto}
.cfg-nav .g{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:hsl(var(--text-muted));padding:12px 12px 4px}
.cfg-nav a{display:block;padding:6px 12px;font-size:13px;color:hsl(var(--foreground));text-decoration:none;
  border-radius:6px;cursor:pointer}
.cfg-nav a:hover{background:hsl(var(--surface2))}
.cfg-nav a.active{background:hsl(var(--blue-pale));color:hsl(var(--blue-mid));font-weight:600}
@media(max-width:820px){.cfg{grid-template-columns:1fr}.sidebar{width:64px}.sidebar .brand,.sidebar .grp,.sidebar a span{display:none}.main{margin-left:64px}}

/* ---------- MODAL ---------- */
#modal-bg{position:fixed;inset:0;background:rgba(15,29,53,.45);display:none;align-items:flex-start;
  justify-content:center;z-index:60;overflow-y:auto;padding:40px 16px}
#modal-bg.open{display:flex}
.modal{background:hsl(var(--card));border-radius:var(--radius);width:min(560px,100%);
  box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.modal .head{padding:16px 20px;border-bottom:1px solid hsl(var(--border));display:flex;justify-content:space-between;align-items:center}
.modal .head h3{font-size:15px;font-weight:600}
.modal .body{padding:18px 20px;overflow-y:auto}
.modal .foot{padding:14px 20px;border-top:1px solid hsl(var(--border));display:flex;gap:10px;justify-content:flex-end}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px}
.chk input{width:auto}
/* ---------- TOAST ---------- */
#toast{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:hsl(var(--foreground));color:#fff;padding:10px 16px;border-radius:var(--radius-sm);
  font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .2s}
.toast.ok{background:hsl(var(--success))}.toast.err{background:hsl(var(--destructive))}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <form class="login-card" onsubmit="return doLogin(event)">
    <h1>ERP Bononi</h1>
    <p>Grupo Bononi Acessórios</p>
    <div class="field"><label>Usuário</label><input id="li-login" autocomplete="username" required></div>
    <div class="field"><label>Senha</label><input id="li-senha" type="password" autocomplete="current-password" required></div>
    <div id="li-err" class="err hidden" style="margin-bottom:12px"></div>
    <button class="btn btn-block" type="submit">Entrar</button>
  </form>
</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar">
    <div class="brand">ERP Bononi</div>
    <div id="menu"></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="title" id="page-title">Dashboard</div>
      <div class="user"><span id="user-name"></span><button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button></div>
    </div>
    <div class="content" id="screen"></div>
  </div>
</div>

<!-- MODAL + TOAST -->
<div id="modal-bg"><div class="modal">
  <div class="head"><h3 id="modal-title"></h3><button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button></div>
  <div class="body" id="modal-body"></div>
  <div class="foot" id="modal-foot"></div>
</div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="core.js"></script>
<script src="config.js"></script>
<script src="financeiro.js"></script>
<script src="estoque.js"></script>
<script src="fiscal.js"></script>
<script src="vendas.js"></script>
<script src="produtos.js"></script>
<script src="clientes.js"></script>
<script src="compras.js"></script>
<script src="orcamentos.js"></script>
<script src="estoque_mov.js"></script>
<script src="sistema.js"></script>
</body>
</html>
